<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - M&R Institution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #0f172a;
            background: #f8fafc;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 50;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo-area { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: inherit; }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #0f2744, #14b8a6);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 800; font-size: 1rem;
        }
        .logo-area h1 { font-size: 1.25rem; font-weight: 800; color: #0f2744; letter-spacing: -0.01em; }
        .logo-area small { display: block; font-size: 0.7rem; color: #64748b; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }

        .header-right { display: flex; align-items: center; gap: 1.5rem; }
        nav { display: flex; gap: 1.5rem; align-items: center; }
        nav a { color: #64748b; text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: color 0.2s; }
        nav a:hover { color: #0f2744; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: #0f2744; color: white;
            padding: 0.6rem 1.2rem; border-radius: 8px;
            text-decoration: none; font-weight: 600; font-size: 0.95rem;
            transition: all 0.2s;
        }
        .back-btn:hover { background: #1e3a5f; transform: translateY(-1px); }
        .back-btn svg { width: 16px; height: 16px; fill: currentColor; }

        /* Main */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
            background: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 100%);
            position: relative;
            overflow: hidden;
        }
        main::before {
            content: '';
            position: absolute;
            top: -50%; left: -20%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(20,184,166,0.15), transparent 70%);
            border-radius: 50%;
        }
        main::after {
            content: '';
            position: absolute;
            bottom: -50%; right: -20%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(15,39,68,0.1), transparent 70%);
            border-radius: 50%;
        }

        .register-wrap {
            max-width: 500px;
            width: 100%;
            padding: 2.5rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(15,23,42,0.12);
            position: relative;
            z-index: 2;
            border: 1px solid #e2e8f0;
        }

        .register-icon {
            width: 64px; height: 64px;
            margin: 0 auto 1.25rem;
            background: linear-gradient(135deg, #0f2744, #14b8a6);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(15,39,68,0.2);
            font-size: 1.75rem;
        }

        .register-wrap h2 {
            text-align: center;
            color: #0f2744;
            margin-bottom: 0.35rem;
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .register-wrap .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 0.92rem;
        }

        .register-wrap label {
            display: block;
            margin-bottom: 0.4rem;
            color: #334155;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 1rem;
        }
        .input-wrap svg {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            width: 18px; height: 18px;
            fill: #94a3b8;
            pointer-events: none;
        }
        .input-wrap input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.98rem;
            font-family: inherit;
            background: #f8fafc;
            color: #0f172a;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .input-wrap input:focus {
            outline: none;
            border-color: #14b8a6;
            background: white;
            box-shadow: 0 0 0 3px rgba(20,184,166,0.1);
        }

        .pw-hint {
            font-size: 0.78rem;
            color: #94a3b8;
            margin: -0.5rem 0 1rem;
            display: block;
        }

        .register-btn {
            width: 100%;
            padding: 0.95rem;
            background: #0f2744;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }
        .register-btn:hover:not(:disabled) {
            background: #1e3a5f;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(15,39,68,0.2);
        }
        .register-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .msg {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            min-height: 1.2rem;
            padding: 0.5rem;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .msg.error { color: #991b1b; background: #fee2e2; }
        .msg.success { color: #166534; background: #dcfce7; }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.5rem 0;
            color: #94a3b8;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .login-link {
            text-align: center;
            font-size: 0.92rem;
            color: #64748b;
        }
        .login-link a {
            color: #0d9488;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }
        .login-link a:hover { color: #0f2744; text-decoration: underline; }

        /* Footer */
        footer {
            background: #0f2744;
            color: rgba(255,255,255,0.7);
            padding: 1.5rem 2rem;
            text-align: center;
            font-size: 0.85rem;
        }
        footer p { margin: 0; }

        @media (max-width: 600px) {
            header { padding: 1rem; }
            .header-right { gap: 0.75rem; }
            nav { gap: 0.9rem; }
            nav a { font-size: 0.85rem; }
            .register-wrap { padding: 1.75rem; border-radius: 16px; }
            .register-wrap h2 { font-size: 1.4rem; }
            .logo-area h1 { font-size: 1.05rem; }
            main { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="../index.html" class="logo-area">
            <div class="logo-icon">M&R</div>
            <div>
                <h1>M&R Institution</h1>
                <small>Excellence in Education</small>
            </div>
        </a>
        <div class="header-right">
            <nav>
                <a href="../index.html">Home</a>
                <a href="../courses.html">Courses</a>
                <a href="../contact.html">Contact</a>
            </nav>
            <a href="login.html" class="back-btn">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                Login
            </a>
        </div>
    </header>

    <main>
        <div class="register-wrap">
            <div class="register-icon">🎓</div>

            <h2>Create Your Account</h2>
            <p class="subtitle">Register to start your application</p>

            <form id="register-form">
                <label>Full Name</label>
                <div class="input-wrap">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.34 0-10 1.67-10 5v3h20v-3c0-3.33-6.66-5-10-5z"/></svg>
                    <input type="text" id="full_name" placeholder="John Doe" required autocomplete="name">
                </div>

                <label>Email</label>
                <div class="input-wrap">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>

                <label>Password</label>
                <div class="input-wrap">
                    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                    <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                </div>
                <span class="pw-hint">Minimum 6 characters</span>

                <label>Confirm Password</label>
                <div class="input-wrap">
                    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                    <input type="password" id="confirm_password" placeholder="Re-type password" required autocomplete="new-password">
                </div>

                <button type="submit" class="register-btn" id="submit-btn">Create Account</button>

                <p class="msg" id="message"></p>
            </form>

            <div class="divider">or</div>

            <p class="login-link">
                Already have an account? <a href="login.html">Log in</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 M&R Institution. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const { createClient } = supabase;
      const supabaseClient = createClient(
        'https://hcufdggmbrhbcenoboef.supabase.co',
        'sb_publishable_78sLh6qbQtYP2KFhpx-NuA_HvBOpKnD'
      );

      const form = document.getElementById('register-form');
      const msg = document.getElementById('message');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.className = 'msg';
        msg.textContent = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';

        const fullName = document.getElementById('full_name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;

        // Validate
        if (password !== confirm) {
          msg.className = 'msg error';
          msg.textContent = '❌ Passwords do not match.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }

        if (password.length < 6) {
          msg.className = 'msg error';
          msg.textContent = '❌ Password must be at least 6 characters.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }

        // Create user
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { full_name: fullName }
          }
        });

        if (error) {
          msg.className = 'msg error';
          msg.textContent = '❌ ' + error.message;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }

        if (!data.user) {
          msg.className = 'msg error';
          msg.textContent = '❌ Registration failed. Please try again.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }

        // Create profile row with 'student' role
        await supabaseClient.from('profiles').upsert({
          id: data.user.id,
          email: email,
          role: 'student'
        }, { onConflict: 'id' });

        msg.className = 'msg success';
        msg.textContent = '✅ Account created! Redirecting to login...';
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      });
    </script>
</body>
</html>
