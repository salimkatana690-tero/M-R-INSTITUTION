<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - College Financial</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .dashboard {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eee;
        }
        .dashboard-header h2 {
            color: #1e3a5f;
            margin: 0;
        }
        .btn-danger {
            background: #c0392b;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-primary {
            background: #1e3a5f;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 1rem;
            display: inline-block;
            margin-bottom: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f4f4f4;
            color: #1e3a5f;
        }
        .actions button {
            padding: 0.35rem 0.75rem;
            margin-right: 0.35rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-edit { background: #3498db; color: white; }
        .btn-delete { background: #c0392b; color: white; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
        }
        .modal h3 { color: #1e3a5f; margin-bottom: 1rem; }
        .modal input, .modal textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
        #dashboard-view, #loading { padding: 2rem; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1>College Financial</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../courses.html">Courses</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main>
        <div id="loading">Loading dashboard...</div>

        <div id="dashboard-view" style="display: none;">
            <div class="dashboard">
                <div class="dashboard-header">
                    <h2>Admin Dashboard</h2>
                    <div>
                        <span id="user-email" style="margin-right: 1rem; color: #666;"></span>
                        <button id="logout-btn" class="btn-danger">Log Out</button>
                    </div>
                </div>

                <h3 style="color: #1e3a5f;">Courses</h3>
                <button id="add-course-btn" class="btn-primary">+ Add New Course</button>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Credits</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="courses-table-body">
                        <tr><td colspan="5">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 College Financial</p>
    </footer>

    <!-- Modal for Add/Edit -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Add Course</h3>
            <form id="course-form">
                <input type="hidden" id="course-id">
                <input type="text" id="course-name" placeholder="Course name" required>
                <textarea id="course-description" placeholder="Description"></textarea>
                <input type="text" id="course-department" placeholder="Department">
                <input type="number" id="course-credits" placeholder="Credits" value="3">
                <div class="modal-actions">
                    <button type="button" id="cancel-btn" style="background:#ccc;color:#333;padding:0.5rem 1rem;border:none;border-radius:4px;cursor:pointer;">Cancel</button>
                    <button type="submit" class="btn-primary" style="margin:0;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const { createClient } = supabase;
      const supabaseClient = createClient(
        'https://hcufdggmbrhbcenoboef.supabase.co',
        'sb_publishable_78sLh6qbQtYP2KFhpx-NuA_HvBOpKnD'
      );

      let currentUser = null;

      // Load dashboard or redirect to login
      async function init() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
          window.location.href = 'login.html';
          return;
        }
        currentUser = session.user;

        // Verify admin role
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('role')
          .eq('id', currentUser.id)
          .single();

        if (!profile || profile.role !== 'admin') {
          await supabaseClient.auth.signOut();
          window.location.href = 'login.html';
          return;
        }

        document.getElementById('user-email').textContent = currentUser.email;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'block';
        loadCourses();
      }

      // Fetch and render courses
      async function loadCourses() {
        const { data, error } = await supabaseClient
          .from('courses')
          .select('*')
          .order('id');

        const tbody = document.getElementById('courses-table-body');
        if (error) {
          tbody.innerHTML = '<tr><td colspan="5">Error: ' + error.message + '</td></tr>';
          return;
        }

        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="5">No courses yet. Click "Add New Course".</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(c => `
          <tr>
            <td>${c.id}</td>
            <td>${c.name}</td>
            <td>${c.department || '-'}</td>
            <td>${c.credits}</td>
            <td class="actions">
              <button class="btn-edit" onclick="editCourse(${c.id})">Edit</button>
              <button class="btn-delete" onclick="deleteCourse(${c.id})">Delete</button>
            </td>
          </tr>
        `).join('');

        window._courses = data;
      }

      // Logout
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
      });

      // Modal open/close
      const overlay = document.getElementById('modal-overlay');
      const form = document.getElementById('course-form');
      const modalTitle = document.getElementById('modal-title');

      document.getElementById('add-course-btn').addEventListener('click', () => {
        modalTitle.textContent = 'Add Course';
        form.reset();
        document.getElementById('course-id').value = '';
        overlay.classList.add('active');
      });

      document.getElementById('cancel-btn').addEventListener('click', () => {
        overlay.classList.remove('active');
      });

      // Edit
      window.editCourse = (id) => {
        const c = window._courses.find(x => x.id === id);
        if (!c) return;
        modalTitle.textContent = 'Edit Course';
        document.getElementById('course-id').value = c.id;
        document.getElementById('course-name').value = c.name;
        document.getElementById('course-description').value = c.description || '';
        document.getElementById('course-department').value = c.department || '';
        document.getElementById('course-credits').value = c.credits || 3;
        overlay.classList.add('active');
      };

      // Delete
      window.deleteCourse = async (id) => {
        if (!confirm('Delete this course?')) return;
        const { error } = await supabaseClient.from('courses').delete().eq('id', id);
        if (error) {
          alert('Error: ' + error.message);
        } else {
          loadCourses();
        }
      };

      // Save (add or update)
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('course-id').value;
        const payload = {
          name: document.getElementById('course-name').value,
          description: document.getElementById('course-description').value,
          department: document.getElementById('course-department').value,
          credits: parseInt(document.getElementById('course-credits').value) || 3
        };

        let result;
        if (id) {
          result = await supabaseClient.from('courses').update(payload).eq('id', id);
        } else {
          result = await supabaseClient.from('courses').insert(payload);
        }

        if (result.error) {
          alert('Error: ' + result.error.message);
          return;
        }

        overlay.classList.remove('active');
        loadCourses();
      });

      init();
    </script>
</body>
</html>
