<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Results - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-page { max-width: 1200px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 8px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid #eee; }
        .admin-header h2 { color: #1e3a5f; margin: 0; }
        .admin-nav a { margin-right: 1rem; color: #1e3a5f; text-decoration: none; font-weight: 500; }
        .admin-nav a.active { border-bottom: 2px solid #1e3a5f; padding-bottom: 2px; }
        .btn-danger { background: #c0392b; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .btn-primary { background: #1e3a5f; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f4f4f4; color: #1e3a5f; }
        .actions button { padding: 0.35rem 0.75rem; margin-right: 0.35rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .btn-edit { background: #3498db; color: white; }
        .btn-delete { background: #c0392b; color: white; }
        .grade-badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 10px; font-size: 0.8rem; font-weight: bold; }
        .grade-A { background: #e8f8f0; color: #1e8449; }
        .grade-B { background: #e8f4fd; color: #2471a3; }
        .grade-C { background: #fef5e7; color: #b9770e; }
        .grade-D { background: #fdecea; color: #a93226; }
        .grade-F { background: #fdecea; color: #7b241c; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 2rem; border-radius: 8px; max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; }
        .modal h3 { color: #1e3a5f; margin-bottom: 1rem; }
        .modal label { display: block; margin-bottom: 0.25rem; color: #333; font-size: 0.9rem; font-weight: 500; margin-top: 1rem; }
        .modal input, .modal select, .modal textarea { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; box-sizing: border-box; }
        .modal textarea { min-height: 80px; resize: vertical; }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        #loading { text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <header>
        <h1>College Financial</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main>
        <div id="loading">Loading...</div>

        <div id="admin-view" style="display: none;">
            <div class="admin-page">
                <div class="admin-header">
                    <div>
                        <h2>Results</h2>
                        <div class="admin-nav" style="margin-top:0.5rem;">
                            <a href="dashboard.html">Courses</a>
                            <a href="applications.html">Applications</a>
                            <a href="announcements.html">Announcements</a>
                            <a href="timetables.html">Timetables</a>
                            <a href="results.html" class="active">Results</a>
                            <a href="fees.html">Fees</a>
                        </div>
                    </div>
                    <div>
                        <span id="user-email" style="margin-right: 1rem; color: #666;"></span>
                        <button id="logout-btn" class="btn-danger">Log Out</button>
                    </div>
                </div>

                <button id="add-btn" class="btn-primary">+ Add Result</button>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Student</th>
                            <th>Course</th>
                            <th>Exam</th>
                            <th>Score</th>
                            <th>Grade</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="results-tbody">
                        <tr><td colspan="7">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 College Financial</p>
    </footer>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Add Result</h3>
            <form id="result-form">
                <input type="hidden" id="result-id">

                <label>Student *</label>
                <select id="student" required></select>

                <label>Course *</label>
                <select id="course" required></select>

                <label>Exam Name *</label>
                <input type="text" id="exam_name" placeholder="e.g. Midterm, Final" required>

                <div class="row">
                    <div>
                        <label>Score (0-100) *</label>
                        <input type="number" id="score" min="0" max="100" required>
                    </div>
                    <div>
                        <label>Grade</label>
                        <input type="text" id="grade" placeholder="Auto from score" maxlength="2">
                    </div>
                </div>

                <label>Remarks</label>
                <textarea id="remarks" placeholder="Optional remarks..."></textarea>

                <div class="modal-actions">
                    <button type="button" id="cancel-btn" style="background:#ccc;color:#333;padding:0.6rem 1rem;border:none;border-radius:4px;cursor:pointer;">Cancel</button>
                    <button type="submit" class="btn-primary" style="margin:0;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const { createClient } = supabase;
      const supabaseClient = createClient(
        'https://hcufdggmbrhbcenoboef.supabase.co',
        'sb_publishable_78sLh6qbQtYP2KFhpx-NuA_HvBOpKnD'
      );

      let currentUser = null;
      let results = [];
      let students = [];
      let courses = [];

      function scoreToGrade(score) {
        if (score >= 80) return 'A';
        if (score >= 70) return 'B';
        if (score >= 60) return 'C';
        if (score >= 50) return 'D';
        return 'F';
      }

      async function init() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        currentUser = session.user;

        const { data: profile } = await supabaseClient
          .from('profiles').select('role').eq('id', currentUser.id).single();

        if (!profile || profile.role !== 'admin') {
          await supabaseClient.auth.signOut();
          window.location.href = 'login.html';
          return;
        }

        document.getElementById('user-email').textContent = currentUser.email;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('admin-view').style.display = 'block';

        // Load students (role = student)
        const { data: sData } = await supabaseClient
          .from('profiles').select('id, email').eq('role', 'student');
        students = sData || [];
        document.getElementById('student').innerHTML = '<option value="">-- Select --</option>' +
          students.map(s => `<option value="${s.id}">${s.email}</option>`).join('');

        // Load courses
        const { data: cData } = await supabaseClient.from('courses').select('id, name').order('name');
        courses = cData || [];
        document.getElementById('course').innerHTML = '<option value="">-- Select --</option>' +
          courses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

        loadResults();
      }

      async function loadResults() {
        const { data, error } = await supabaseClient
          .from('results').select('*').order('created_at', { ascending: false });

        const tbody = document.getElementById('results-tbody');
        if (error) { tbody.innerHTML = '<tr><td colspan="7">Error: ' + error.message + '</td></tr>'; return; }

        results = data || [];
        if (!results.length) {
          tbody.innerHTML = '<tr><td colspan="7">No results yet.</td></tr>';
          return;
        }

        tbody.innerHTML = results.map(r => {
          const stu = students.find(s => s.id === r.student_id);
          const c = courses.find(x => x.id === r.course_id);
          const gradeClass = r.grade ? `grade-${r.grade[0]}` : 'grade-C';
          return `
            <tr>
              <td>${r.id}</td>
              <td>${stu ? stu.email : '—'}</td>
              <td>${c ? c.name : '—'}</td>
              <td>${r.exam_name}</td>
              <td>${r.score}</td>
              <td><span class="grade-badge ${gradeClass}">${r.grade || '—'}</span></td>
              <td class="actions">
                <button class="btn-edit" onclick="editResult(${r.id})">Edit</button>
                <button class="btn-delete" onclick="deleteResult(${r.id})">Delete</button>
              </td>
            </tr>
          `;
        }).join('');
      }

      const overlay = document.getElementById('modal-overlay');
      const form = document.getElementById('result-form');

      // Auto-fill grade from score
      document.getElementById('score').addEventListener('input', (e) => {
        const v = parseInt(e.target.value);
        if (!isNaN(v)) document.getElementById('grade').value = scoreToGrade(v);
      });

      document.getElementById('add-btn').addEventListener('click', () => {
        document.getElementById('modal-title').textContent = 'Add Result';
        form.reset();
        document.getElementById('result-id').value = '';
        overlay.classList.add('active');
      });

      document.getElementById('cancel-btn').addEventListener('click', () => {
        overlay.classList.remove('active');
      });

      window.editResult = (id) => {
        const r = results.find(x => x.id === id);
        if (!r) return;
        document.getElementById('modal-title').textContent = 'Edit Result';
        document.getElementById('result-id').value = r.id;
        document.getElementById('student').value = r.student_id;
        document.getElementById('course').value = r.course_id;
        document.getElementById('exam_name').value = r.exam_name;
        document.getElementById('score').value = r.score;
        document.getElementById('grade').value = r.grade || '';
        document.getElementById('remarks').value = r.remarks || '';
        overlay.classList.add('active');
      };

      window.deleteResult = async (id) => {
        if (!confirm('Delete this result?')) return;
        const { error } = await supabaseClient.from('results').delete().eq('id', id);
        if (error) { alert('Error: ' + error.message); return; }
        loadResults();
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('result-id').value;
        const score = parseInt(document.getElementById('score').value);
        const payload = {
          student_id: document.getElementById('student').value,
          course_id: parseInt(document.getElementById('course').value),
          exam_name: document.getElementById('exam_name').value.trim(),
          score: score,
          grade: document.getElementById('grade').value.trim() || scoreToGrade(score),
          remarks: document.getElementById('remarks').value.trim() || null,
          updated_at: new Date().toISOString()
        };

        let result;
        if (id) {
          result = await supabaseClient.from('results').update(payload).eq('id', id);
        } else {
          result = await supabaseClient.from('results').insert(payload);
        }

        if (result.error) { alert('Error: ' + result.error.message); return; }
        overlay.classList.remove('active');
        loadResults();
      });

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
      });

      init();
    </script>
</body>
</html>
