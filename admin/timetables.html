<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timetables - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-page { max-width: 1200px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 8px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid #eee; }
        .admin-header h2 { color: #1e3a5f; margin: 0; }
        .admin-nav a { margin-right: 1rem; color: #1e3a5f; text-decoration: none; font-weight: 500; }
        .admin-nav a.active { border-bottom: 2px solid #1e3a5f; padding-bottom: 2px; }
        .btn-danger { background: #c0392b; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .btn-primary { background: #1e3a5f; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f4f4f4; color: #1e3a5f; }
        .actions button { padding: 0.35rem 0.75rem; margin-right: 0.35rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .btn-edit { background: #3498db; color: white; }
        .btn-delete { background: #c0392b; color: white; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 2rem; border-radius: 8px; max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; }
        .modal h3 { color: #1e3a5f; margin-bottom: 1rem; }
        .modal label { display: block; margin-bottom: 0.25rem; color: #333; font-size: 0.9rem; font-weight: 500; margin-top: 1rem; }
        .modal input, .modal select { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; box-sizing: border-box; }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        #loading { text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <header>
        <h1>College Financial</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main>
        <div id="loading">Loading...</div>

        <div id="admin-view" style="display: none;">
            <div class="admin-page">
                <div class="admin-header">
                    <div>
                        <h2>Timetables</h2>
                        <div class="admin-nav" style="margin-top:0.5rem;">
                            <a href="dashboard.html">Courses</a>
                            <a href="applications.html">Applications</a>
                            <a href="announcements.html">Announcements</a>
                            <a href="timetables.html" class="active">Timetables</a>
                            <a href="results.html">Results</a>
                            <a href="fees.html">Fees</a>
                        </div>
                    </div>
                    <div>
                        <span id="user-email" style="margin-right: 1rem; color: #666;"></span>
                        <button id="logout-btn" class="btn-danger">Log Out</button>
                    </div>
                </div>

                <button id="add-btn" class="btn-primary">+ New Timetable Entry</button>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Course</th>
                            <th>Day</th>
                            <th>Time</th>
                            <th>Room</th>
                            <th>Lecturer</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tt-tbody">
                        <tr><td colspan="7">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 College Financial</p>
    </footer>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">New Timetable Entry</h3>
            <form id="tt-form">
                <input type="hidden" id="tt-id">

                <label>Course *</label>
                <select id="tt-course" required></select>

                <label>Day of Week *</label>
                <select id="tt-day" required>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                </select>

                <div class="row">
                    <div>
                        <label>Start Time *</label>
                        <input type="time" id="tt-start" required>
                    </div>
                    <div>
                        <label>End Time *</label>
                        <input type="time" id="tt-end" required>
                    </div>
                </div>

                <label>Room</label>
                <input type="text" id="tt-room" placeholder="e.g. Room A101">

                <label>Lecturer</label>
                <input type="text" id="tt-lecturer" placeholder="e.g. Dr. Smith">

                <div class="modal-actions">
                    <button type="button" id="cancel-btn" style="background:#ccc;color:#333;padding:0.6rem 1rem;border:none;border-radius:4px;cursor:pointer;">Cancel</button>
                    <button type="submit" class="btn-primary" style="margin:0;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const { createClient } = supabase;
      const supabaseClient = createClient(
        'https://hcufdggmbrhbcenoboef.supabase.co',
        'sb_publishable_78sLh6qbQtYP2KFhpx-NuA_HvBOpKnD'
      );

      let currentUser = null;
      let timetables = [];
      let courses = [];

      async function init() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        currentUser = session.user;

        const { data: profile } = await supabaseClient
          .from('profiles').select('role').eq('id', currentUser.id).single();

        if (!profile || profile.role !== 'admin') {
          await supabaseClient.auth.signOut();
          window.location.href = 'login.html';
          return;
        }

        document.getElementById('user-email').textContent = currentUser.email;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('admin-view').style.display = 'block';

        // Load courses
        const { data: cData } = await supabaseClient.from('courses').select('id, name').order('name');
        courses = cData || [];
        const sel = document.getElementById('tt-course');
        sel.innerHTML = '<option value="">-- Select --</option>' +
          courses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

        loadTimetables();
      }

      async function loadTimetables() {
        const { data, error } = await supabaseClient
          .from('timetables')
          .select('*')
          .order('day_of_week');

        const tbody = document.getElementById('tt-tbody');
        if (error) { tbody.innerHTML = '<tr><td colspan="7">Error: ' + error.message + '</td></tr>'; return; }

        timetables = data || [];
        if (!timetables.length) {
          tbody.innerHTML = '<tr><td colspan="7">No entries yet.</td></tr>';
          return;
        }

        tbody.innerHTML = timetables.map(t => {
          const c = courses.find(x => x.id === t.course_id);
          return `
            <tr>
              <td>${t.id}</td>
              <td>${c ? c.name : '—'}</td>
              <td>${t.day_of_week}</td>
              <td>${t.start_time} – ${t.end_time}</td>
              <td>${t.room || '—'}</td>
              <td>${t.lecturer || '—'}</td>
              <td class="actions">
                <button class="btn-edit" onclick="editTt(${t.id})">Edit</button>
                <button class="btn-delete" onclick="deleteTt(${t.id})">Delete</button>
              </td>
            </tr>
          `;
        }).join('');
      }

      const overlay = document.getElementById('modal-overlay');
      const form = document.getElementById('tt-form');

      document.getElementById('add-btn').addEventListener('click', () => {
        document.getElementById('modal-title').textContent = 'New Timetable Entry';
        form.reset();
        document.getElementById('tt-id').value = '';
        overlay.classList.add('active');
      });

      document.getElementById('cancel-btn').addEventListener('click', () => {
        overlay.classList.remove('active');
      });

      window.editTt = (id) => {
        const t = timetables.find(x => x.id === id);
        if (!t) return;
        document.getElementById('modal-title').textContent = 'Edit Entry';
        document.getElementById('tt-id').value = t.id;
        document.getElementById('tt-course').value = t.course_id;
        document.getElementById('tt-day').value = t.day_of_week;
        document.getElementById('tt-start').value = t.start_time;
        document.getElementById('tt-end').value = t.end_time;
        document.getElementById('tt-room').value = t.room || '';
        document.getElementById('tt-lecturer').value = t.lecturer || '';
        overlay.classList.add('active');
      };

      window.deleteTt = async (id) => {
        if (!confirm('Delete this entry?')) return;
        const { error } = await supabaseClient.from('timetables').delete().eq('id', id);
        if (error) { alert('Error: ' + error.message); return; }
        loadTimetables();
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('tt-id').value;
        const payload = {
          course_id: parseInt(document.getElementById('tt-course').value),
          day_of_week: document.getElementById('tt-day').value,
          start_time: document.getElementById('tt-start').value,
          end_time: document.getElementById('tt-end').value,
          room: document.getElementById('tt-room').value.trim() || null,
          lecturer: document.getElementById('tt-lecturer').value.trim() || null
        };

        let result;
        if (id) {
          result = await supabaseClient.from('timetables').update(payload).eq('id', id);
        } else {
          result = await supabaseClient.from('timetables').insert(payload);
        }

        if (result.error) { alert('Error: ' + result.error.message); return; }
        overlay.classList.remove('active');
        loadTimetables();
      });

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
      });

      init();
    </script>
</body>
</html>
