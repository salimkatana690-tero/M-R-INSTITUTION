<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Applications - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-page {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eee;
        }
        .admin-header h2 { color: #1e3a5f; margin: 0; }
        .btn-danger { background: #c0392b; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .admin-nav a { margin-right: 1rem; color: #1e3a5f; text-decoration: none; font-weight: 500; }
        .admin-nav a.active { border-bottom: 2px solid #1e3a5f; padding-bottom: 2px; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #eee; vertical-align: top; }
        th { background: #f4f4f4; color: #1e3a5f; }
        .status-badge {
            display: inline-block; padding: 0.25rem 0.6rem;
            border-radius: 12px; font-size: 0.8rem; font-weight: bold;
            text-transform: uppercase; white-space: nowrap;
        }
        .status-pending { background: #fef5e7; color: #b9770e; }
        .status-under_review { background: #e8f4fd; color: #2471a3; }
        .status-accepted { background: #e8f8f0; color: #1e8449; }
        .status-rejected { background: #fdecea; color: #a93226; }
        .actions button {
            padding: 0.35rem 0.6rem; margin: 0.15rem;
            border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
        }
        .btn-view { background: #3498db; color: white; }
        .btn-accept { background: #27ae60; color: white; }
        .btn-reject { background: #c0392b; color: white; }
        .btn-review { background: #f39c12; color: white; }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; padding: 2rem; border-radius: 8px;
            max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto;
        }
        .modal h3 { color: #1e3a5f; margin-bottom: 1rem; }
        .info-row { margin: 0.5rem 0; padding: 0.5rem 0; border-bottom: 1px solid #f0f0f0; }
        .info-row strong { color: #1e3a5f; display: inline-block; width: 150px; }
        .modal textarea { width: 100%; padding: 0.75rem; margin-top: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; min-height: 80px; box-sizing: border-box; }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; flex-wrap: wrap; }
        .modal-actions button { padding: 0.6rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        #loading { text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <header>
        <h1>College Financial</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="applications.html">Applications</a>
        </nav>
    </header>

    <main>
        <div id="loading">Loading...</div>

        <div id="admin-view" style="display: none;">
            <div class="admin-page">
                <div class="admin-header">
                    <div>
                        <h2>Applications</h2>
                        <div class="admin-nav" style="margin-top:0.5rem;">
                            <a href="dashboard.html">Courses</a>
                            <a href="applications.html" class="active">Applications</a>
                        </div>
                    </div>
                    <div>
                        <span id="user-email" style="margin-right: 1rem; color: #666;"></span>
                        <button id="logout-btn" class="btn-danger">Log Out</button>
                    </div>
                </div>

                <div id="stats" style="margin-bottom: 1rem; color: #666;"></div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Status</th>
                            <th>Submitted</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="apps-tbody">
                        <tr><td colspan="7">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 College Financial</p>
    </footer>

    <!-- Detail Modal -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Application Details</h3>
            <div id="modal-body"></div>
            <label style="display:block; margin-top:1rem; color:#333; font-size:0.9rem; font-weight:500;">Admin Notes</label>
            <textarea id="admin-notes" placeholder="Optional notes about this application..."></textarea>
            <div class="modal-actions">
                <button id="close-btn" style="background:#ccc;color:#333;">Close</button>
                <button id="btn-pending" class="btn-review">Mark Pending</button>
                <button id="btn-under-review" class="btn-view">Under Review</button>
                <button id="btn-reject" class="btn-reject">Reject</button>
                <button id="btn-accept" class="btn-accept">Accept</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const { createClient } = supabase;
      const supabaseClient = createClient(
        'https://hcufdggmbrhbcenoboef.supabase.co',
        'sb_publishable_78sLh6qbQtYP2KFhpx-NuA_HvBOpKnD'
      );

      let currentUser = null;
      let applications = [];
      let courses = [];
      let currentAppId = null;

      async function init() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        currentUser = session.user;

        const { data: profile } = await supabaseClient
          .from('profiles').select('role').eq('id', currentUser.id).single();

        if (!profile || profile.role !== 'admin') {
          await supabaseClient.auth.signOut();
          window.location.href = 'login.html';
          return;
        }

        document.getElementById('user-email').textContent = currentUser.email;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('admin-view').style.display = 'block';

        // Load courses for name lookup
        const { data: cData } = await supabaseClient.from('courses').select('id, name');
        courses = cData || [];

        loadApplications();
      }

      async function loadApplications() {
        const { data, error } = await supabaseClient
          .from('applications')
          .select('*')
          .order('submitted_at', { ascending: false });

        const tbody = document.getElementById('apps-tbody');

        if (error) {
          tbody.innerHTML = '<tr><td colspan="7">Error: ' + error.message + '</td></tr>';
          return;
        }

        applications = data || [];

        // Stats
        const counts = { pending: 0, under_review: 0, accepted: 0, rejected: 0 };
        applications.forEach(a => counts[a.status] = (counts[a.status] || 0) + 1);
        document.getElementById('stats').innerHTML =
          `<strong>Total:</strong> ${applications.length} &nbsp;|&nbsp; ` +
          `⏳ Pending: ${counts.pending} &nbsp;|&nbsp; ` +
          `🔍 Under Review: ${counts.under_review} &nbsp;|&nbsp; ` +
          `✅ Accepted: ${counts.accepted} &nbsp;|&nbsp; ` +
          `❌ Rejected: ${counts.rejected}`;

        if (!applications.length) {
          tbody.innerHTML = '<tr><td colspan="7">No applications yet.</td></tr>';
          return;
        }

        tbody.innerHTML = applications.map(a => {
          const course = courses.find(c => c.id === a.course_id);
          const date = new Date(a.submitted_at).toLocaleDateString();
          return `
            <tr>
              <td>#${a.id}</td>
              <td>${a.full_name}</td>
              <td>${a.email}</td>
              <td>${course ? course.name : '—'}</td>
              <td><span class="status-badge status-${a.status}">${a.status.replace('_',' ')}</span></td>
              <td>${date}</td>
              <td class="actions">
                <button class="btn-view" onclick="openApp(${a.id})">View</button>
              </td>
            </tr>
          `;
        }).join('');
      }

      window.openApp = (id) => {
        const a = applications.find(x => x.id === id);
        if (!a) return;
        currentAppId = id;
        const course = courses.find(c => c.id === a.course_id);

        document.getElementById('modal-title').textContent = 'Application #' + a.id;
        document.getElementById('modal-body').innerHTML = `
          <div class="info-row"><strong>Full Name:</strong> ${a.full_name}</div>
          <div class="info-row"><strong>Email:</strong> ${a.email}</div>
          <div class="info-row"><strong>Phone:</strong> ${a.phone || '—'}</div>
          <div class="info-row"><strong>Date of Birth:</strong> ${a.date_of_birth || '—'}</div>
          <div class="info-row"><strong>Address:</strong> ${a.address || '—'}</div>
          <div class="info-row"><strong>Course:</strong> ${course ? course.name : '—'}</div>
          <div class="info-row"><strong>Previous School:</strong> ${a.previous_school || '—'}</div>
          <div class="info-row"><strong>Grades:</strong> ${a.grades || '—'}</div>
          <div class="info-row"><strong>Personal Statement:</strong><br>${a.personal_statement || '—'}</div>
          <div class="info-row"><strong>Current Status:</strong> <span class="status-badge status-${a.status}">${a.status.replace('_',' ')}</span></div>
        `;
        document.getElementById('admin-notes').value = a.admin_notes || '';
        document.getElementById('modal-overlay').classList.add('active');
      };

      document.getElementById('close-btn').addEventListener('click', () => {
        document.getElementById('modal-overlay').classList.remove('active');
      });

      async function updateStatus(newStatus) {
        if (!currentAppId) return;
        const notes = document.getElementById('admin-notes').value.trim();
        const { error } = await supabaseClient
          .from('applications')
          .update({ status: newStatus, admin_notes: notes, updated_at: new Date().toISOString() })
          .eq('id', currentAppId);

        if (error) { alert('Error: ' + error.message); return; }
        document.getElementById('modal-overlay').classList.remove('active');
        loadApplications();
      }

      document.getElementById('btn-pending').addEventListener('click', () => updateStatus('pending'));
      document.getElementById('btn-under-review').addEventListener('click', () => updateStatus('under_review'));
      document.getElementById('btn-accept').addEventListener('click', () => updateStatus('accepted'));
      document.getElementById('btn-reject').addEventListener('click', () => updateStatus('rejected'));

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
      });

      init();
    </script>
</body>
</html>
