<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Announcements - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-page { max-width: 1100px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 8px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid #eee; }
        .admin-header h2 { color: #1e3a5f; margin: 0; }
        .admin-nav a { margin-right: 1rem; color: #1e3a5f; text-decoration: none; font-weight: 500; }
        .admin-nav a.active { border-bottom: 2px solid #1e3a5f; padding-bottom: 2px; }
        .btn-danger { background: #c0392b; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .btn-primary { background: #1e3a5f; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-bottom: 1.5rem; }
        .ann-list { display: flex; flex-direction: column; gap: 1rem; }
        .ann-card { padding: 1.25rem; border-radius: 6px; border-left: 5px solid #3498db; background: #fafafa; }
        .ann-card.high { border-left-color: #f39c12; }
        .ann-card.urgent { border-left-color: #c0392b; }
        .ann-card h3 { color: #1e3a5f; margin-bottom: 0.5rem; }
        .ann-card .meta { color: #666; font-size: 0.85rem; margin-bottom: 0.75rem; }
        .ann-card .actions { margin-top: 0.75rem; }
        .ann-card button { padding: 0.35rem 0.75rem; margin-right: 0.5rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .btn-edit { background: #3498db; color: white; }
        .btn-delete { background: #c0392b; color: white; }
        .priority-badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 10px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-left: 0.5rem; }
        .priority-normal { background: #e8f4fd; color: #2471a3; }
        .priority-high { background: #fef5e7; color: #b9770e; }
        .priority-urgent { background: #fdecea; color: #a93226; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 2rem; border-radius: 8px; max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; }
        .modal h3 { color: #1e3a5f; margin-bottom: 1rem; }
        .modal label { display: block; margin-bottom: 0.25rem; color: #333; font-size: 0.9rem; font-weight: 500; margin-top: 1rem; }
        .modal input, .modal textarea, .modal select { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; box-sizing: border-box; }
        .modal textarea { min-height: 120px; resize: vertical; }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }
        #loading { text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <header>
        <h1>College Financial</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main>
        <div id="loading">Loading...</div>

        <div id="admin-view" style="display: none;">
            <div class="admin-page">
                <div class="admin-header">
                 <div class="admin-nav">
    <a href="dashboard.html">Courses</a>
    <a href="applications.html">Applications</a>
    <a href="announcements.html">Announcements</a>
    <a href="timetables.html">Timetables</a>
    <a href="results.html">Results</a>
    <a href="fees.html">Fees</a>
</div>
                    </div>
                    <div>
                        <span id="user-email" style="margin-right: 1rem; color: #666;"></span>
                        <button id="logout-btn" class="btn-danger">Log Out</button>
                    </div>
                </div>

                <button id="add-btn" class="btn-primary">+ New Announcement</button>

                <div class="ann-list" id="ann-list">
                    <p>Loading...</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 College Financial</p>
    </footer>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">New Announcement</h3>
            <form id="ann-form">
                <input type="hidden" id="ann-id">
                <label>Title *</label>
                <input type="text" id="ann-title" required>
                <label>Content *</label>
                <textarea id="ann-content" required></textarea>
                <label>Priority</label>
                <select id="ann-priority">
                    <option value="normal">Normal</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent</option>
                </select>
                <div class="modal-actions">
                    <button type="button" id="cancel-btn" style="background:#ccc;color:#333;padding:0.6rem 1rem;border:none;border-radius:4px;cursor:pointer;">Cancel</button>
                    <button type="submit" class="btn-primary" style="margin:0;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const { createClient } = supabase;
      const supabaseClient = createClient(
        'https://hcufdggmbrhbcenoboef.supabase.co',
        'sb_publishable_78sLh6qbQtYP2KFhpx-NuA_HvBOpKnD'
      );

      let currentUser = null;
      let announcements = [];

      async function init() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        currentUser = session.user;

        const { data: profile } = await supabaseClient
          .from('profiles').select('role').eq('id', currentUser.id).single();

        if (!profile || profile.role !== 'admin') {
          await supabaseClient.auth.signOut();
          window.location.href = 'login.html';
          return;
        }

        document.getElementById('user-email').textContent = currentUser.email;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('admin-view').style.display = 'block';
        loadAnnouncements();
      }

      async function loadAnnouncements() {
        const { data, error } = await supabaseClient
          .from('announcements')
          .select('*')
          .order('created_at', { ascending: false });

        const list = document.getElementById('ann-list');
        if (error) { list.innerHTML = '<p style="color:#c0392b;">Error: ' + error.message + '</p>'; return; }

        announcements = data || [];
        if (!announcements.length) {
          list.innerHTML = '<p>No announcements yet. Click "New Announcement".</p>';
          return;
        }

        list.innerHTML = announcements.map(a => `
          <div class="ann-card ${a.priority}">
            <h3>${a.title} <span class="priority-badge priority-${a.priority}">${a.priority}</span></h3>
            <div class="meta">Posted ${new Date(a.created_at).toLocaleDateString()}</div>
            <p>${a.content}</p>
            <div class="actions">
              <button class="btn-edit" onclick="editAnn(${a.id})">Edit</button>
              <button class="btn-delete" onclick="deleteAnn(${a.id})">Delete</button>
            </div>
          </div>
        `).join('');
      }

      const overlay = document.getElementById('modal-overlay');
      const form = document.getElementById('ann-form');

      document.getElementById('add-btn').addEventListener('click', () => {
        document.getElementById('modal-title').textContent = 'New Announcement';
        form.reset();
        document.getElementById('ann-id').value = '';
        overlay.classList.add('active');
      });

      document.getElementById('cancel-btn').addEventListener('click', () => {
        overlay.classList.remove('active');
      });

      window.editAnn = (id) => {
        const a = announcements.find(x => x.id === id);
        if (!a) return;
        document.getElementById('modal-title').textContent = 'Edit Announcement';
        document.getElementById('ann-id').value = a.id;
        document.getElementById('ann-title').value = a.title;
        document.getElementById('ann-content').value = a.content;
        document.getElementById('ann-priority').value = a.priority;
        overlay.classList.add('active');
      };

      window.deleteAnn = async (id) => {
        if (!confirm('Delete this announcement?')) return;
        const { error } = await supabaseClient.from('announcements').delete().eq('id', id);
        if (error) { alert('Error: ' + error.message); return; }
        loadAnnouncements();
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('ann-id').value;
        const payload = {
          title: document.getElementById('ann-title').value.trim(),
          content: document.getElementById('ann-content').value.trim(),
          priority: document.getElementById('ann-priority').value,
          updated_at: new Date().toISOString()
        };

        let result;
        if (id) {
          result = await supabaseClient.from('announcements').update(payload).eq('id', id);
        } else {
          payload.created_by = currentUser.id;
          result = await supabaseClient.from('announcements').insert(payload);
        }

        if (result.error) { alert('Error: ' + result.error.message); return; }
        overlay.classList.remove('active');
        loadAnnouncements();
      });

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
      });

      init();
    </script>
</body>
</html>
