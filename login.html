<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - College Financial</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a5f 0%, #2c4a73 100%);
            min-height: 100vh;
        }
        header, footer {
            background: rgba(0, 0, 0, 0.2);
        }
        .login-wrap {
            max-width: 440px;
            margin: 3rem auto;
            padding: 2.5rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }
        .login-wrap h2 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 0.25rem;
            font-size: 1.75rem;
        }
        .login-wrap .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .login-wrap label {
            display: block;
            margin-bottom: 0.3rem;
            color: #333;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .login-wrap input {
            width: 100%;
            padding: 0.85rem;
            margin-bottom: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .login-wrap input:focus {
            outline: none;
            border-color: #1e3a5f;
        }
        .login-wrap button {
            width: 100%;
            padding: 0.9rem;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .login-wrap button:hover { background: #2c4a73; }
        .login-wrap button:disabled { background: #95a5a6; cursor: not-allowed; }
        .msg {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            min-height: 1.2rem;
        }
        .msg.error { color: #c0392b; }
        .msg.success { color: #27ae60; }
        .login-wrap .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }
        .login-wrap .footer-links a {
            color: #1e3a5f;
            text-decoration: none;
            font-weight: 500;
        }
        .login-wrap .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>College Financial</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="courses.html">Courses</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <div class="login-wrap">
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to access your dashboard</p>

            <form id="login-form">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">

                <label>Password</label>
                <input type="password" id="password" placeholder="Your password" required autocomplete="current-password">

                <button type="submit" id="submit-btn">Log In</button>
            </form>

            <p id="message" class="msg"></p>

            <p class="footer-links">
                New student? <a href="apply/register.html">Register here</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 College Financial</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const { createClient } = supabase;
      const supabaseClient = createClient(
        'https://hcufdggmbrhbcenoboef.supabase.co',
        'sb_publishable_78sLh6qbQtYP2KFhpx-NuA_HvBOpKnD'
      );

      // Where each role goes after login
      const ROLE_REDIRECT = {
        'student':   'apply/portal.html',
        'admin':     'admin/dashboard.html',
        'lecturer':  'staff/lecturer.html',
        'hod':       'staff/hod.html',
        'finance':   'staff/finance.html',
        'principal': 'staff/principal.html',
        'deputy':    'staff/deputy.html'
      };

      const form = document.getElementById('login-form');
      const msg = document.getElementById('message');
      const submitBtn = document.getElementById('submit-btn');

      // If already logged in, redirect based on their role
      (async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) return;
        const { data: profile } = await supabaseClient
          .from('profiles').select('role').eq('id', session.user.id).single();
        const dest = ROLE_REDIRECT[profile?.role];
        if (dest) window.location.href = dest;
      })();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.className = 'msg';
        msg.textContent = 'Logging in...';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          msg.className = 'msg error';
          msg.textContent = 'Login failed: ' + error.message;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
          return;
        }

        // Get user's role
        const { data: profile, error: profileErr } = await supabaseClient
          .from('profiles').select('role').eq('id', data.user.id).single();

        if (profileErr || !profile) {
          msg.className = 'msg error';
          msg.textContent = 'Profile not found. Contact admin.';
          await supabaseClient.auth.signOut();
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
          return;
        }

        const destination = ROLE_REDIRECT[profile.role];

        if (!destination) {
          msg.className = 'msg error';
          msg.textContent = 'Unknown role: ' + profile.role + '. Contact admin.';
          await supabaseClient.auth.signOut();
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
          return;
        }

        msg.className = 'msg success';
        msg.textContent = 'Welcome! Redirecting to your dashboard...';
        setTimeout(() => { window.location.href = destination; }, 700);
      });
    </script>
</body>
</html>
